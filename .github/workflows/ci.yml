name: Verify AI Design
on:
  push:
    branches: [main]
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Typecheck
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Browser page smoke and screenshots
        run: |
          npm run start > /tmp/ai-design-server.log 2>&1 &
          for i in {1..25}; do
            if curl -sf -o /dev/null http://127.0.0.1:3000/create; then break; fi
            sleep 1
          done
          node scripts/ui-review.mjs
      - name: Upload UI screenshots and lockfile
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-review-and-lockfile
          path: |
            artifacts/ui/*.png
            package-lock.json
