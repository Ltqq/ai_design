name: One-time RToc API check
# Deliberately not part of ordinary CI. No schedule, no pull_request, no workflow_dispatch.
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/rtoc-live-once.yml

jobs:
  probe:
    # This exact commit message authorizes the only live test.
    if: github.event.head_commit.message == 'test: run one-time rtoc live api smoke'
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    permissions:
      contents: read
    env:
      CHATKEY: ${{ secrets.CHATKEY }}
      IMAGEKEY: ${{ secrets.IMAGEKEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Probe chat/tool protocol and image generation once
        run: node scripts/rtoc-live-once.mjs
