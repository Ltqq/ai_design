name: Resolve Mastra memory lockfile once
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/lock-mastra-once.yml

permissions:
  contents: write

jobs:
  resolve:
    if: >-
      github.event.head_commit.message == 'build: resolve mastra memory lockfile once'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve dependencies without executing app scripts
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit only the lockfile
        run: |
          git config user.name github-actions
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add package-lock.json
          git commit -m 'build: lock Mastra memory and libsql dependencies'
          git push origin HEAD:main
